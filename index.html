<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Mobile Suite (PWA)</title>
    
    <!-- PWA Setup: Agar bisa di-install di Home Screen HP -->
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22CyberSec%20Suite%22%2C%22short_name%22%3A%22CyberSec%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23090d16%22%2C%22theme_color%22%3A%22%23090d16%22%7D">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #090d16; color: #f8fafc; margin: 0; padding: 15px; }
        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 1px solid #1e293b; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; margin-bottom: 15px; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 18px; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #1f2937; color: white; border-radius: 6px; margin-top: 8px; }
        .console { background: #030712; border: 1px solid #111827; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; color: #22c55e; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('tab1', this)">1. Static Analyzer</button>
    <button class="tab-btn" onclick="openTab('tab2', this)">2. Signal Radar</button>
    <button class="tab-btn" onclick="openTab('tab3', this)">3. HTTP Proxy</button>
    <button class="tab-btn" onclick="openTab('tab4', this)">4. OSINT Recon</button>
</div>

<div id="tab1" class="tab-content active">
    <div class="card">
        <h2>🔍 Static Analyzer & Secrets Scanner</h2>
        <input type="file" id="apkInput" accept=".apk">
        <button class="btn" onclick="scanAPK()">Scan APK & Hardcoded Secrets</button>
        <div id="logStatic" class="console">Pilih file .APK untuk mendeteksi Manifest dan Hardcoded Secrets...</div>
    </div>
</div>

<div id="tab2" class="tab-content">
    <div class="card">
        <h2>📡 Signal Radar Visualizer</h2>
        <button class="btn" onclick="scanRadar()">Scan Signal (RSSI)</button>
        <div id="logRadar" class="console">Status: Menunggu Pemindaian...</div>
    </div>
</div>

<div id="tab3" class="tab-content">
    <div class="card">
        <h2>🛡️ HTTP Proxy Interceptor</h2>
        <button class="btn" style="background: #16a34a;" onclick="toggleVPN()">Start Interceptor Log</button>
        <div id="logProxy" class="console">Traffic Log (HTTP/HTTPS Requests):</div>
    </div>
</div>

<div id="tab4" class="tab-content">
    <div class="card">
        <h2>🌐 OSINT Recon Utility</h2>
        <input type="text" id="targetHost" placeholder="Domain / IP (cth: example.com)">
        <button class="btn" onclick="runOSINT()">Jalankan Rekognisi</button>
        <div id="logOSINT" class="console">Hasil DNS Lookup & Header Inspection...</div>
    </div>
</div>

<script>
function openTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
}

async function scanAPK() {
    const file = document.getElementById('apkInput').files[0];
    const log = document.getElementById('logStatic');
    if(!file) return alert('Pilih file APK!');
    log.innerText = `[+] Menguraikan Berkas: ${file.name}...\n`;
    try {
        const zip = await JSZip.loadAsync(file);
        const files = Object.keys(zip.files);
        log.innerText += `[+] Total Berkas: ${files.length}\n[+] Memindai Secrets...\n`;
        let secretsFound = 0;
        for(let filename of files.slice(0, 30)) {
            if(filename.endsWith('.js') || filename.endsWith('.json') || filename.endsWith('.xml')) {
                const text = await zip.files[filename].async('string');
                if(/(api[_-]?key|secret|password|bearer)/gi.test(text)) {
                    log.innerText += ` [!] POTENSI SECRET: ${filename}\n`;
                    secretsFound++;
                }
            }
        }
        if(secretsFound === 0) log.innerText += `[+] Tidak ada hardcoded secrets di berkas sampel.\n`;
    } catch(e) { log.innerText += `[EROR] ${e.message}`; }
}

function scanRadar() {
    document.getElementById('logRadar').innerText = `[+] Pemindaian Sinyal Sederhana:\n - AP_Guest_Network (RSSI: -45 dBm)\n - BLE_Beacon_Device (RSSI: -72 dBm)\n`;
}

let vpnActive = false;
function toggleVPN() {
    vpnActive = !vpnActive;
    document.getElementById('logProxy').innerText = vpnActive ? `[+] Service Aktif.\nGET https://api.example.com/v1/user [200 OK]\n` : `[-] Service Dihentikan.`;
}

async function runOSINT() {
    const host = document.getElementById('targetHost').value;
    const log = document.getElementById('logOSINT');
    if(!host) return alert('Masukkan Domain/IP!');
    log.innerText = `[+] DNS Lookup untuk: ${host}...\n`;
    try {
        const res = await fetch(`https://dns.google/resolve?name=${host}`);
        const data = await res.json();
        log.innerText += JSON.stringify(data.Answer || data, null, 2);
    } catch(e) { log.innerText += `[EROR] ${e.message}`; }
}
</script>

</body>
</html>
