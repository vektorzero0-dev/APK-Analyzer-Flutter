name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Android Project with Capacitor
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/
        else
          echo '<!DOCTYPE html><html><head><title>APK Analyzer</title></head><body><h2>APK Static Analyzer</h2></body></html>' > www/index.html
        fi
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
        npx cap init "APKAnalyzer" "com.vektorzero.app" --web-dir "www"
        npx cap add android
        mkdir -p android/app/src/main/assets
        echo '[]' > android/app/src/main/assets/capacitor.plugins.json
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APK-Static-Analyzer-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
